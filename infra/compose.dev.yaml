services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: pir
      POSTGRES_USER: pir
      POSTGRES_PASSWORD: pir-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pir-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pir"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pir-dev-db:
